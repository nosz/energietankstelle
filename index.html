    <script>
      // Check that service workers are supported
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(function (reg) {
            console.log("Service Worker registriert!", reg);
          })
          .catch(function (err) {
            console.log("Service Worker Fehler: ", err);
          });

        // Automatisches Neuladen, sobald eine neue Version des Service
        // Workers die Kontrolle übernommen hat, damit der Nutzer immer die
        // aktuellste Version angezeigt bekommt, ohne die App manuell
        // schließen und neu öffnen zu müssen.
        //
        // hadControllerAtLoad verhindert einen unnötigen Reload direkt beim
        // allerersten Öffnen der Seite (dann gab es ja noch keine "alte"
        // Version, die abgelöst wird).
        //
        // Reload wird verzögert, solange die Seite nicht sichtbar ist (z.B.
        // weil der native Teilen-Dialog offen ist) oder gerade ein Teilen
        // läuft (window.shareInProgress, siehe energystation.js) - sonst
        // würde ein Reload mitten im Teilen-Vorgang die App scheinbar
        // "neu starten".
        var hadControllerAtLoad = !!navigator.serviceWorker.controller;
        var hasReloaded = false;
        var reloadPending = false;

        function reloadWennBereit() {
          if (hasReloaded) return;
          if (document.hidden || window.shareInProgress) {
            reloadPending = true;
            return;
          }
          hasReloaded = true;
          window.location.reload();
        }

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadControllerAtLoad) return;
          reloadWennBereit();
        });

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden && reloadPending) {
            reloadWennBereit();
          }
        });

        // Wird von energystation.js aufgerufen, sobald der Teilen-Schutz
        // (window.shareInProgress) wirklich endet - also bestätigt nach
        // Rückkehr in die App plus Sicherheitspuffer, siehe
        // planeShareSchutzEnde() dort. Notwendig, weil manche Android-
        // Browser document.hidden während des nativen Share-Screens nie auf
        // true setzen - dann würde der obige visibilitychange-Listener nie
        // feuern und ein zurückgehaltener Reload bliebe für immer hängen.
        window.zeigeReloadFallsAusstehend = function () {
          if (!document.hidden && reloadPending) {
            reloadWennBereit();
          }
        };
      }
    </script>
